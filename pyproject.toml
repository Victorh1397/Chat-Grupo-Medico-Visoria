[project]
name = "chat-grupo-medico-visoria"
version = "0.1.0"
description = "Asistente conversacional por voz de Grupo Médico Visoria (Dialogflow ES + FastAPI + OCR + Gemini)"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.3",
    "google-cloud-dialogflow>=2.53.0",
    "google-genai>=2.31.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
